<script>
    document.title='CineVerse';
    const API='49b59c69';
    const demo={email:'demo@CineVerse.com',password:'Demo@123'};
    const fallback=[['tt0468569','The Dark Knight','2008','movie','https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=900&q=80'],['tt4154796','Avengers: Endgame','2019','movie','https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80'],['tt1375666','Inception','2010','movie','https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80'],['tt0816692','Interstellar','2014','movie','https://images.unsplash.com/photo-1513106580091-1d82408b8cd6?auto=format&fit=crop&w=900&q=80']].map(x=>({imdbID:x[0],Title:x[1],Year:x[2],Type:x[3],Poster:x[4]}));
    let logged=localStorage.getItem('cineverse-authenticated')==='true',movies=fallback,query='batman';
    document.head.innerHTML='<meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:#141414;color:white}button,input{font:inherit}a{color:inherit;text-decoration:none}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(#0009,#000d),url(https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80) center/cover}.card{width:min(420px,100%);background:#000c;padding:34px;border-radius:12px}.logo{color:#e50914;font-size:38px;font-weight:800;margin-bottom:22px}.card h2{font-size:30px;margin-bottom:12px}.muted{color:#bbb;line-height:1.5;margin-bottom:18px}.demo{background:#ffffff12;border:1px solid #ffffff24;border-radius:8px;padding:12px;margin-bottom:16px;line-height:1.7}.form{display:grid;gap:12px}.form input,.search input{background:#111;border:1px solid #ffffff33;color:white;border-radius:5px;padding:13px}.btn,.search button,.back{background:#e50914;color:white;border:0;border-radius:5px;padding:12px 18px;font-weight:700;cursor:pointer}.ghost{background:#ffffff24}.err{color:#ff9292;margin-top:8px}.hero{min-height:88vh;background-size:cover;background-position:center;position:relative;display:flex;flex-direction:column;justify-content:space-between}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#141414 8%,#0005 45%,#000d),linear-gradient(to right,#000c,#0002,#0009)}nav,.heroText{position:relative;z-index:1}nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 4%}.search{display:flex;gap:10px}.heroText{max-width:620px;padding:0 4% 110px}.label{text-transform:uppercase;letter-spacing:3px;color:#ddd}.hero h1,.detail h1{font-size:clamp(38px,7vw,68px);line-height:1.02;margin:12px 0 18px}.hero p{font-size:18px;color:#eee;line-height:1.55}.actions{display:flex;gap:12px;margin-top:24px}.content{margin-top:-70px;position:relative;z-index:2;padding:0 4% 50px}.panel{background:#1e1e1eee;border-radius:12px;padding:24px}.rowHead{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.movie{position:relative;overflow:hidden;border-radius:9px;background:#222;min-height:300px}.movie img{width:100%;height:320px;object-fit:cover}.over{position:absolute;inset:auto 0 0;padding:45px 14px 14px;background:linear-gradient(#0000,#000)}.over h3{font-size:17px}.over p{color:#ddd;margin-top:5px}.detail{min-height:100vh;background:#141414;padding-bottom:40px}.detailGrid{display:grid;grid-template-columns:330px 1fr;gap:40px;padding:30px 4%}.poster{width:100%;border-radius:10px}.meta{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 22px}.meta span{background:#ffffff18;padding:8px 12px;border-radius:4px}.plot{max-width:760px;line-height:1.65;color:#e5e5e5;margin-bottom:22px}.block{color:#ddd;margin:12px 0;line-height:1.5}@media(max-width:700px){nav,.search{align-items:stretch;flex-direction:column}.detailGrid{grid-template-columns:1fr}.poster{max-width:330px}.content{margin-top:-35px}}</style>';
    const root=document.body.appendChild(document.createElement('div'));
    function auth(){root.className='auth';root.innerHTML='<div class="card"><div class="logo">CineVerse</div><h2>Login</h2><p class="muted">Sign in to continue to your movie dashboard.</p><div class="demo"><b>Demo Email:</b> '+demo.email+'<br><b>Demo Password:</b> '+demo.password+'<br><button class="btn ghost" id="fill">Use Demo Credentials</button></div><form class="form"><input id="email" placeholder="Email Address"><input id="pass" type="password" placeholder="Password"><button class="btn">Login</button><p class="err" id="err"></p></form></div>';root.querySelector('#fill').onclick=()=>{email.value=demo.email;pass.value=demo.password};root.querySelector('form').onsubmit=e=>{e.preventDefault();if(email.value===demo.email&&pass.value===demo.password){localStorage.setItem('cineverse-authenticated','true');logged=true;home()}else err.textContent='Invalid demo credentials. Use the demo login shown above.'}};
    async function load(q){try{let r=await fetch('https://www.omdbapi.com/?apikey='+API+'&s='+encodeURIComponent(q));let d=await r.json();movies=d.Response==='True'?d.Search.map((m,i)=>({...m,Poster:m.Poster!=='N/A'?m.Poster:fallback[i%fallback.length].Poster})):fallback}catch(e){movies=fallback}}
    async function home(){if(!logged)return auth();await load(query);let f=movies[0]||fallback[0];root.className='';root.innerHTML='<section class="hero" style="background-image:url('+f.Poster+')"><nav><div class="logo">CineVerse</div><form class="search"><input value="'+query+'" placeholder="Search movies"><button>Search</button></form></nav><div class="heroText"><div class="label">Featured Title</div><h1>'+f.Title+'</h1><p>Discover blockbuster movies, timeless classics, and binge-worthy content in a premium Netflix-inspired movie app.</p><div class="actions"><button class="btn" id="more">More Details</button><button class="btn ghost">Browse</button></div></div></section><main class="content"><section class="panel"><div class="rowHead"><h2>Popular Results</h2><span>Search: '+query+'</span></div><div class="grid">'+movies.map(m=>'<article class="movie" data-id="'+m.imdbID+'"><img src="'+m.Poster+'" alt="'+m.Title+'"><div class="over"><h3>'+m.Title+'</h3><p>'+m.Year+'</p><p>'+m.Type+'</p></div></article>').join('')+'</div></section></main>';root.querySelector('.search').onsubmit=e=>{e.preventDefault();query=e.target.querySelector('input').value||'batman';home()};root.querySelector('#more').onclick=()=>detail(f.imdbID);root.querySelectorAll('.movie').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
    async function detail(id){if(!logged)return auth();root.className='detail';root.innerHTML='<nav><div class="logo">CineVerse</div><button class="back">Back</button></nav><p style="padding:30px">Loading movie details...</p>';root.querySelector('.back').onclick=home;let m;try{let r=await fetch('https://www.omdbapi.com/?apikey='+API+'&i='+encodeURIComponent(id));let d=await r.json();m=d.Response==='True'?d:{}}catch(e){m={}};m={...{Title:'The Dark Knight',Year:'2008',Runtime:'152 min',Rated:'UA',imdbRating:'9.0',Genre:'Action, Crime, Drama',Director:'Christopher Nolan',Actors:'Christian Bale, Heath Ledger, Aaron Eckhart',Language:'English',Country:'USA, UK',Plot:'When Gotham is threatened by chaos, Batman faces the Joker in a gripping battle that tests heroism, order, and sacrifice.',Poster:fallback[0].Poster,Type:'movie'},...m};root.innerHTML='<nav><div class="logo">CineVerse</div><button class="back">Back</button></nav><div class="detailGrid"><img class="poster" src="'+(m.Poster==='N/A'?fallback[0].Poster:m.Poster)+'"><section><p class="label">'+m.Type+'</p><h1>'+m.Title+'</h1><div class="meta"><span>'+m.Year+'</span><span>'+m.Runtime+'</span><span>'+m.Rated+'</span><span>Rating '+m.imdbRating+'</span></div><p class="plot">'+m.Plot+'</p><p class="block"><b>Genre:</b> '+m.Genre+'</p><p class="block"><b>Director:</b> '+m.Director+'</p><p class="block"><b>Actors:</b> '+m.Actors+'</p><p class="block"><b>Language:</b> '+m.Language+'</p><p class="block"><b>Country:</b> '+m.Country+'</p></section></div>';root.querySelector('.back').onclick=home}
    home();
    
</script>
